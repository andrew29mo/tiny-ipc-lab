name: Verified IPC and evidence
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0  # Historical audit reopens the immutable original source and raw trials.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Production protocol, processes and reports
        run: python -m unittest discover -s tests -v
      - name: Optimized Python validation
        run: python -O -m unittest discover -s tests
      - name: Behavioral source faults
        run: python tools/run_mutations.py
      - name: Full retained evidence and publication hygiene
        run: |
          python tools/check_project.py --directory results/macos-arm64-pool
          python tools/check_project.py --directory results/macos-arm64-pool-development
          python tools/check_project.py
          python tools/check_project.py --directory results/macos-arm64-pipe-bytes
          python tools/diagnose_rss.py --verify
          python tools/audit_original.py --verify
      - name: Actual IPC smoke, not a performance gate
        run: |
          tiny-ipc-lab --output results/local/ci --sizes 64 4096 --count 17 --pairs 2
          python tools/check_project.py --directory results/local/ci --smoke
          tiny-ipc-lab --pipe-receive bytes --output results/local/ci-bytes --sizes 64 4096 --count 17 --pairs 2
          python tools/check_project.py --directory results/local/ci-bytes --smoke
          python -m tiny_ipc_lab.pool_bench --output results/local/ci-pool --sizes 64 4096 --blocks 2 --capacity 3 --smoke
          python tools/check_project.py --directory results/local/ci-pool --smoke
